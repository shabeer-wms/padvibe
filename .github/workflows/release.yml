name: Build & Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest  # Apple Silicon — fast runner

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ── arm64 sidecar (native) ─────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecar/requirements.txt

      - name: Build sidecar (arm64)
        run: |
          pip install --prefer-binary pyinstaller -r sidecar/requirements.txt
          python -m PyInstaller \
            --onefile \
            --distpath /tmp/sidecar-arm64 \
            --name midi_server \
            --hidden-import='mido.backends.rtmidi' \
            sidecar/midi_server.py

      # ── x86_64 sidecar (Rosetta 2 on the same runner) ─────────────────────
      - name: Install x86_64 Homebrew + Python via Rosetta
        run: |
          softwareupdate --install-rosetta --agree-to-license 2>/dev/null || true
          NONINTERACTIVE=1 arch -x86_64 /bin/bash -c \
            "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          arch -x86_64 /usr/local/bin/brew install --quiet python@3.12

      - name: Build sidecar (x86_64 via Rosetta)
        run: |
          arch -x86_64 /usr/local/bin/pip3.12 install --prefer-binary pyinstaller -r sidecar/requirements.txt
          arch -x86_64 /usr/local/bin/python3.12 -m PyInstaller \
            --onefile \
            --distpath /tmp/sidecar-x86_64 \
            --name midi_server \
            --hidden-import='mido.backends.rtmidi' \
            sidecar/midi_server.py

      # ── Universal binary ───────────────────────────────────────────────────
      - name: Create universal binary
        run: |
          mkdir -p sidecar/dist
          lipo -create \
            /tmp/sidecar-arm64/midi_server \
            /tmp/sidecar-x86_64/midi_server \
            -output sidecar/dist/midi_server
          chmod +x sidecar/dist/midi_server
          codesign --force --deep --sign - sidecar/dist/midi_server
          echo "Architectures: $(lipo -archs sidecar/dist/midi_server)"

      # ── Flutter + DMG + Release ────────────────────────────────────────────
      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Parse version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        id: dmg
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="PadVibe-${VERSION}-Installer.dmg"
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1)
          APP_NAME=$(basename "$APP_PATH")

          STAGING="build/macos/staging"
          mkdir -p "$STAGING"
          cp -r "$APP_PATH" "$STAGING/"
          mkdir -p build/macos/installer

          if create-dmg \
              --volname "PadVibe Installer" \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 100 \
              --icon "$APP_NAME" 150 190 \
              --hide-extension "$APP_NAME" \
              --app-drop-link 450 185 \
              "build/macos/installer/$DMG_NAME" \
              "$STAGING"; then
            echo "create-dmg succeeded"
          else
            hdiutil create \
              -volname "PadVibe" \
              -srcfolder "$STAGING" \
              -ov -format UDZO \
              "build/macos/installer/$DMG_NAME"
          fi

          rm -rf "$STAGING"
          echo "dmg_path=build/macos/installer/$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "PadVibe v${VERSION}" \
            --generate-notes \
            "${{ steps.dmg.outputs.dmg_path }}#${{ steps.dmg.outputs.dmg_name }}"
