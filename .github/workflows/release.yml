name: Build & Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:  # manual run: builds all platforms and uploads artifacts, no release

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple Silicon), os: macos-latest,    platform: macos,   arch: arm64 }
          - { name: macOS (Intel),         os: macos-15-intel,  platform: macos,   arch: x86_64 }
          - { name: Windows,               os: windows-latest,  platform: windows, arch: x64 }
          - { name: Linux,                 os: ubuntu-latest,   platform: linux,   arch: x64 }

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: sidecar/requirements.txt

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libportaudio2 libsndfile1 libasound2-dev libjack-dev

      # Each runner builds its own native sidecar (no cross-arch tricks), as a
      # one-dir bundle: one-file re-extracts and re-scans itself on every launch.
      - name: Build sidecar
        run: PYTHON=python ./sidecar/build_sidecar.sh

      - name: Smoke-test frozen sidecar
        run: |
          BIN=sidecar/dist/midi_server/midi_server
          [ "${{ matrix.platform }}" = "windows" ] && BIN="$BIN.exe"
          python sidecar/smoke_test.py "$BIN"

      - name: Install Flutter dependencies
        run: flutter pub get

      # ── macOS ───────────────────────────────────────────────────────────────
      - name: Build macOS app
        if: matrix.platform == 'macos'
        run: |
          flutter build macos --release
          ./scripts/bundle_sidecar_macos.sh build/macos/Build/Products/Release/PadVibe.app

      - name: Package DMG
        if: matrix.platform == 'macos'
        run: |
          brew install create-dmg
          APP=build/macos/Build/Products/Release/PadVibe.app
          DMG="PadVibe-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.dmg"
          mkdir -p dist build/macos/staging
          cp -R "$APP" build/macos/staging/
          if ! create-dmg \
              --volname "PadVibe Installer" \
              --window-pos 200 120 --window-size 600 400 --icon-size 100 \
              --icon "PadVibe.app" 150 190 --hide-extension "PadVibe.app" \
              --app-drop-link 450 185 \
              "dist/$DMG" build/macos/staging; then
            hdiutil create -volname "PadVibe" -srcfolder build/macos/staging -ov -format UDZO "dist/$DMG"
          fi

      # ── Windows ─────────────────────────────────────────────────────────────
      - name: Build Windows app
        if: matrix.platform == 'windows'
        run: |
          flutter build windows --release
          test -f build/windows/x64/runner/Release/sidecar/midi_server.exe \
            || { echo "sidecar missing from Windows bundle" >&2; exit 1; }

      - name: Package Windows zip
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "dist/PadVibe-${{ steps.version.outputs.version }}-windows-x64.zip"

      # ── Linux ───────────────────────────────────────────────────────────────
      - name: Build Linux app
        if: matrix.platform == 'linux'
        run: |
          flutter build linux --release
          test -x build/linux/x64/release/bundle/sidecar/midi_server \
            || { echo "sidecar missing from Linux bundle" >&2; exit 1; }

      - name: Package Linux tarball
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release -czf \
            "dist/PadVibe-${{ steps.version.outputs.version }}-linux-x64.tar.gz" bundle

      - uses: actions/upload-artifact@v4
        with:
          name: padvibe-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PadVibe ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*

  homebrew:
    name: Update Homebrew tap
    needs: release
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
