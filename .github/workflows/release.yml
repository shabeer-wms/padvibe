name: Build & Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  # Build the sidecar binary for each architecture separately
  build-sidecar:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecar/requirements.txt

      - name: Install dependencies
        run: pip install pyinstaller -r sidecar/requirements.txt

      - name: Build sidecar (${{ matrix.arch }})
        run: |
          rm -rf sidecar/dist
          python -m PyInstaller \
            --onefile \
            --distpath sidecar/dist \
            --name midi_server \
            --hidden-import='mido.backends.rtmidi' \
            sidecar/midi_server.py

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.arch }}
          path: sidecar/dist/midi_server
          retention-days: 1

  build-app:
    needs: build-sidecar
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download arm64 sidecar
        uses: actions/download-artifact@v4
        with:
          name: sidecar-arm64
          path: /tmp/sidecar-arm64

      - name: Download x86_64 sidecar
        uses: actions/download-artifact@v4
        with:
          name: sidecar-x86_64
          path: /tmp/sidecar-x86_64

      - name: Combine into universal binary
        run: |
          mkdir -p sidecar/dist
          lipo -create \
            /tmp/sidecar-arm64/midi_server \
            /tmp/sidecar-x86_64/midi_server \
            -output sidecar/dist/midi_server
          chmod +x sidecar/dist/midi_server
          codesign --force --deep --sign - sidecar/dist/midi_server
          lipo -info sidecar/dist/midi_server

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Parse version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        id: dmg
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="PadVibe-${VERSION}-Installer.dmg"
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1)
          APP_NAME=$(basename "$APP_PATH")

          STAGING="build/macos/staging"
          mkdir -p "$STAGING"
          cp -r "$APP_PATH" "$STAGING/"
          mkdir -p build/macos/installer

          if create-dmg \
              --volname "PadVibe Installer" \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 100 \
              --icon "$APP_NAME" 150 190 \
              --hide-extension "$APP_NAME" \
              --app-drop-link 450 185 \
              "build/macos/installer/$DMG_NAME" \
              "$STAGING"; then
            echo "create-dmg succeeded"
          else
            echo "create-dmg failed, falling back to hdiutil"
            hdiutil create \
              -volname "PadVibe" \
              -srcfolder "$STAGING" \
              -ov -format UDZO \
              "build/macos/installer/$DMG_NAME"
          fi

          rm -rf "$STAGING"
          echo "dmg_path=build/macos/installer/$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "PadVibe v${VERSION}" \
            --generate-notes \
            "${{ steps.dmg.outputs.dmg_path }}#${{ steps.dmg.outputs.dmg_name }}"
